name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360000

    steps:
      - name: Configure RDP, Firewall & Performance
        run: |
          # Enable RDP
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # Firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          # High performance power plan
          powercfg -setactive SCHEME_MIN

          # Disable heavy Windows services
          Stop-Service WSearch -Force
          Set-Service WSearch -StartupType Disabled
          Stop-Service SysMain -Force
          Set-Service SysMain -StartupType Disabled

          # Disable animations (better RDP FPS)
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' -Name VisualFXSetting -Value 2
          Set-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name MinAnimate -Value 0

          Restart-Service TermService -Force

      - name: Create RDP User
        run: |
          Add-Type -AssemblyName System.Security

          $chars = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96))
          }

          $pass = (
            ($chars.Upper | Get-Random -Count 4) +
            ($chars.Lower | Get-Random -Count 4) +
            ($chars.Number | Get-Random -Count 4) +
            ($chars.Special | Get-Random -Count 4)
          ) | Sort-Object { Get-Random }

          $password = -join $pass
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $secure -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $out = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest $url -OutFile $out
          Start-Process msiexec.exe -ArgumentList "/i `"$out`" /quiet /norestart" -Wait
          Remove-Item $out -Force

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-rdp-$env:GITHUB_RUN_ID

          $ip = $null
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { break }
            Start-Sleep 5
          }

          if (-not $ip) { exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        run: |
          Test-NetConnection $env:TAILSCALE_IP -Port 3389

      - name: Keep Alive + RDP Watchdog
        run: |
          Write-Host "=============================="
          Write-Host "RDP ADDRESS : $env:TAILSCALE_IP"
          Write-Host "USERNAME    : $env:RDP_USER"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "=============================="

          while ($true) {
            if ((Get-Service TermService).Status -ne "Running") {
              Restart-Service TermService
            }
            Start-Sleep 300
          }
